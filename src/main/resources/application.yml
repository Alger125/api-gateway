server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Enrutamiento hacia Catalog Service (MongoDB)
        - id: catalog-service-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/games/**

        # Enrutamiento hacia Sales Service (H2 SQL)
        - id: sales-service-route
          uri: lb://sales-service
          predicates:
            - Path=/api/orders/**

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: "gamestore-super-secure-secret-key-gamestore-2026-very-long-key-32bytes-min"
  expiration-ms: 3600000
